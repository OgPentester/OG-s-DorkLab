[package]
name = "google-dork-tool"
version = "0.1.0"
edition = "2021"

[lib]
name = "google_dork_tool_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "google-dork-tool"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
